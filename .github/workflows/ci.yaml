name: Run Python Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies (CPU-only torch)
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev]"

    - name: Run Unit Tests
      run: python -m pytest

  package:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Check the wheel installs and imports
      run: |
        python -m venv /tmp/wheel-env
        /tmp/wheel-env/bin/pip install --no-deps dist/*.whl
        /tmp/wheel-env/bin/python -c "import lmspell, sys; print(lmspell.__version__); assert 'torch' not in sys.modules"
