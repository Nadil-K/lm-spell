name: Run Python Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Flatten repository directory
      run: |
        echo "Before move:"
        ls -la
        mv neural-spell-checker-library/* .
        mv neural-spell-checker-library/.* . 2>/dev/null || true
        rm -rf neural-spell-checker-library
        echo "After move:"
        ls -la

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Unit Tests
      run: |
        cd neural-spell-checker-library
        echo PYTHONPATH: $PYTHONPATH
        echo pwd: $(pwd)
        export PYTHONPATH=$(pwd)
        pytest -v